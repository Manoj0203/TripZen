<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Emerald Coin Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- White / Silver Coin Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Zen Sun Glow -->
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </linearGradient>

    <!-- Road Surface Gradient -->
    <linearGradient id="roadGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="coinShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="planeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Canvas -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)"/>
  <rect width="1020" height="1020" x="2" y="2" rx="222" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Calm Zen Sun / Horizon Circle -->
  <circle cx="512" cy="400" r="260" fill="url(#sunGlow)"/>

  <!-- Minimalist Geometric Mountain Peaks (Trip Landscape) -->
  <!-- Back Mountain -->
  <polygon points="180,680 440,340 700,680" fill="#1E293B" fill-opacity="0.5"/>
  <polygon points="440,340 700,680 440,680" fill="#0F172A" fill-opacity="0.4"/>
  <!-- Front Mountain (Majestic Peak) -->
  <polygon points="340,720 580,300 820,720" fill="#1E293B" fill-opacity="0.8"/>
  <polygon points="580,300 820,720 580,720" fill="#0B0F19" fill-opacity="0.6"/>
  <!-- Crisp Snowcap -->
  <polygon points="580,300 628,384 580,364 532,384" fill="#F8FAFC" fill-opacity="0.85"/>

  <!-- THE WINDING SPLIT ROUTE -->
  <g filter="url(#softShadow)">
    <!-- Base Highway Route -->
    <!-- Left Branch -->
    <path d="M 512 880 C 512 760, 480 720, 512 620 C 528 560, 360 480, 320 370" 
          fill="none" stroke="#10B981" stroke-width="48" stroke-linecap="round"/>
    <path d="M 512 880 C 512 760, 480 720, 512 620 C 528 560, 360 480, 320 370" 
          fill="none" stroke="#064E3B" stroke-width="40" stroke-linecap="round"/>
    
    <!-- Right Branch -->
    <path d="M 512 880 C 512 760, 480 720, 512 620 C 496 560, 664 480, 704 370" 
          fill="none" stroke="#E2E8F0" stroke-width="48" stroke-linecap="round"/>
    <path d="M 512 880 C 512 760, 480 720, 512 620 C 496 560, 664 480, 704 370" 
          fill="none" stroke="#0F172A" stroke-width="40" stroke-linecap="round"/>

    <!-- Highway Dashed Center Line (Left Branch) -->
    <path d="M 512 860 C 512 760, 480 720, 512 620 C 528 560, 360 480, 320 370" 
          fill="none" stroke="#34D399" stroke-width="6" stroke-dasharray="16 16" stroke-linecap="round"/>
    
    <!-- Highway Dashed Center Line (Right Branch) -->
    <path d="M 512 860 C 512 760, 480 720, 512 620 C 496 560, 664 480, 704 370" 
          fill="none" stroke="#38BDF8" stroke-width="6" stroke-dasharray="16 16" stroke-linecap="round"/>

    <!-- Forking Split Node (The Hub) -->
    <circle cx="512" cy="620" r="28" fill="#0F172A" stroke="#10B981" stroke-width="8"/>
    <circle cx="512" cy="620" r="10" fill="#FFFFFF"/>
  </g>

  <!-- Left Coin Token (Emerald Share) -->
  <g filter="url(#coinShadow)">
    <circle cx="320" cy="330" r="105" fill="url(#emeraldGrad)"/>
    <!-- Outer Rim -->
    <circle cx="320" cy="330" r="88" fill="none" stroke="#A7F3D0" stroke-width="6" stroke-opacity="0.7"/>
    <!-- Clean Math Division / Split Sign -->
    <rect x="275" y="323" width="90" height="14" rx="7" fill="#FFFFFF"/>
    <circle cx="320" cy="285" r="14" fill="#FFFFFF"/>
    <circle cx="320" cy="375" r="14" fill="#FFFFFF"/>
  </g>

  <!-- Right Coin Token (Silver / Ice Share) -->
  <g filter="url(#coinShadow)">
    <circle cx="704" cy="330" r="105" fill="url(#silverGrad)"/>
    <!-- Outer Rim -->
    <circle cx="704" cy="330" r="88" fill="none" stroke="#64748B" stroke-width="6" stroke-opacity="0.35"/>
    <!-- Clean Math Division / Split Sign -->
    <rect x="659" y="323" width="90" height="14" rx="7" fill="#0F172A"/>
    <circle cx="704" cy="285" r="14" fill="#0F172A"/>
    <circle cx="704" cy="375" r="14" fill="#0F172A"/>
  </g>

  <!-- High-flying Paper Airplane Soaring over the peaks -->
  <g filter="url(#planeShadow)" transform="translate(512, 175) rotate(-10)">
    <!-- Origami Glider -->
    <polygon points="0,-64 48,46 0,22 -48,46" fill="#FFFFFF"/>
    <polygon points="0,-64 0,22 -48,46" fill="#CBD5E1"/>
    <polygon points="0,-64 0,22 48,46" fill="#F8FAFC"/>
  </g>
</svg>
