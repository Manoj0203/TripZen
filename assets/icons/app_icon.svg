<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient - Full Bleed Square -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Zen Sun / Horizon Glow -->
    <linearGradient id="sunGlow3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Emerald Card Gradient -->
    <linearGradient id="cardEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Ice / Sky Card Gradient -->
    <linearGradient id="cardIce" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="planeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full-bleed Edge-to-Edge 1024x1024 Square Background (No corner radius, No border) -->
  <rect width="1024" height="1024" fill="url(#bgGrad3)"/>

  <!-- Zen Sun / Compass Horizon in Background -->
  <circle cx="512" cy="420" r="240" fill="url(#sunGlow3)"/>
  <circle cx="512" cy="420" r="240" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 8"/>
  <circle cx="512" cy="420" r="180" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- CARDS FORMING A MAJESTIC MOUNTAIN SUMMIT -->
  <!-- Two payment cards angled upward to form a sharp mountain summit -->

  <!-- RIGHT CARD (Ice-White / Sky Blue Share) -->
  <g filter="url(#cardShadow)">
    <g transform="translate(580, 560) rotate(32)">
      <!-- Card Body -->
      <rect x="-180" y="-280" width="360" height="560" rx="28" fill="url(#cardIce)" stroke="#FFFFFF" stroke-width="2"/>
      
      <!-- Card Magnetic Stripe / Accent Band -->
      <rect x="-180" y="-210" width="360" height="70" fill="#38BDF8" fill-opacity="0.2"/>
      
      <!-- Card Chip (Silver/Grey) -->
      <rect x="-130" y="-90" width="70" height="52" rx="10" fill="#94A3B8" fill-opacity="0.5"/>
      <path d="M -130 -64 L -60 -64 M -95 -90 L -95 -38" stroke="#64748B" stroke-width="2"/>

      <!-- Minimalist Contactless Waves -->
      <path d="M 90 -75 A 24 24 0 0 1 90 -45 M 105 -85 A 36 36 0 0 1 105 -35 M 120 -95 A 48 48 0 0 1 120 -25" 
            fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round" stroke-opacity="0.5"/>

      <!-- Circles / Brand Dots -->
      <circle cx="100" cy="180" r="32" fill="#38BDF8" fill-opacity="0.35"/>
      <circle cx="65" cy="180" r="32" fill="#0284C7" fill-opacity="0.25"/>
    </g>
  </g>

  <!-- LEFT CARD (TripZen Emerald Green Share) -->
  <g filter="url(#cardShadow)">
    <g transform="translate(444, 560) rotate(-32)">
      <!-- Card Body -->
      <rect x="-180" y="-280" width="360" height="560" rx="28" fill="url(#cardEmerald)" stroke="#6EE7B7" stroke-width="2"/>
      
      <!-- Card Dark Emerald Accent Band -->
      <rect x="-180" y="-210" width="360" height="70" fill="#065F46" fill-opacity="0.35"/>

      <!-- EMV Gold Chip -->
      <rect x="-130" y="-90" width="70" height="52" rx="10" fill="#FDE047" fill-opacity="0.9"/>
      <path d="M -130 -64 L -60 -64 M -95 -90 L -95 -38" stroke="#CA8A04" stroke-width="2.5"/>

      <!-- Contactless Waves -->
      <path d="M 90 -75 A 24 24 0 0 1 90 -45 M 105 -85 A 36 36 0 0 1 105 -35 M 120 -95 A 48 48 0 0 1 120 -25" 
            fill="none" stroke="#A7F3D0" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>

      <!-- TripZen Brand Glyph on Card -->
      <circle cx="100" cy="180" r="32" fill="#A7F3D0" fill-opacity="0.4"/>
      <circle cx="65" cy="180" r="32" fill="#FFFFFF" fill-opacity="0.3"/>
    </g>
  </g>

  <!-- Geometric Mountain Summit Crest / Apex -->
  <polygon points="512,275 556,335 512,315 468,335" fill="#FFFFFF" filter="url(#planeShadow)"/>

  <!-- Elegant Paper Airplane taking off over the Mountain Peak -->
  <g filter="url(#planeShadow)" transform="translate(512, 185) rotate(-5)">
    <!-- Origami Glider -->
    <polygon points="0,-70 54,50 0,25 -54,50" fill="#FFFFFF"/>
    <polygon points="0,-70 0,25 -54,50" fill="#CBD5E1"/>
    <polygon points="0,-70 0,25 54,50" fill="#F8FAFC"/>
  </g>

  <!-- Modern Split Ledger / Balance Pill at Bottom -->
  <g transform="translate(512, 870)">
    <rect x="-120" y="-26" width="240" height="52" rx="26" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <!-- Emerald Dot -->
    <circle cx="-70" cy="0" r="14" fill="#10B981"/>
    <!-- Division / Split Symbol -->
    <rect x="-18" y="-3" width="36" height="6" rx="3" fill="#94A3B8"/>
    <circle cx="0" cy="-12" r="4" fill="#94A3B8"/>
    <circle cx="0" cy="12" r="4" fill="#94A3B8"/>
    <!-- Sky Blue Dot -->
    <circle cx="70" cy="0" r="14" fill="#38BDF8"/>
  </g>
</svg>
